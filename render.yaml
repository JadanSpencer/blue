services:
  - type: web
    name: blue-ember-demo
    runtime: static
    staticPublishPath: .
    headers:
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
